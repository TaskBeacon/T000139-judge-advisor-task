  items:
    eiffel:
      question: 埃菲尔铁塔竣工并举行落成仪式是哪一年？
      truth: 1889
      source_url: https://www.toureiffel.paris/en/news/130-years/1889-2019-130-years-amazement
    panama:
      question: 巴拿马运河正式通航是哪一年？
      truth: 1914
      source_url: https://pancanal.com/en/panama-canal-turns-90/
    xray:
      question: 伦琴发现X射线是哪一年？
      truth: 1895
      source_url: https://www.nobelprize.org/prizes/themes/the-dual-nature-of-light-as-reflected-in-the-nobel-archives
    penicillin:
      question: 弗莱明首次发现青霉素的抗菌作用是哪一年？
      truth: 1928
      source_url: https://www.nobelprize.org/uploads/2018/06/fleming-lecture.pdf
    wright:
      question: 莱特兄弟首次成功进行有动力、可控的飞机飞行是哪一年？
      truth: 1903
      source_url: https://www.nps.gov/places/6-first-flights-december-17-1903.htm
    telephone:
      question: 贝尔获得美国第174465号电话相关专利是哪一年？
      truth: 1876
      source_url: https://www.loc.gov/everyday-mysteries/technology/item/who-is-credited-with-inventing-the-telephone/
    nobel:
      question: 第一届诺贝尔奖颁发是哪一年？
      truth: 1901
      source_url: https://www.nobelprize.org/about/
    gagarin:
      question: 加加林首次进入太空并绕地球飞行是哪一年？
      truth: 1961
      source_url: https://science.nasa.gov/resource/yuri-gagarin-first-human-in-space/
    apollo:
      question: 阿波罗11号首次实现人类登月是哪一年？
      truth: 1969
      source_url: https://www.nasa.gov/mission/apollo-11/
    sputnik:
      question: 苏联发射第一颗人造地球卫星斯普特尼克1号是哪一年？
      truth: 1957
      source_url: https://www.nasa.gov/history/dawn-of-the-space-age/
    web:
      question: 伯纳斯-李在欧洲核子研究中心提出万维网最初方案是哪一年？
      truth: 1989
      source_url: https://home.cern/world-wide-web-35/
    olympics:
      question: 雅典举办第一届现代奥林匹克运动会是哪一年？
      truth: 1896
      source_url: https://olympicgames.culture.gov.gr/en/revival.html

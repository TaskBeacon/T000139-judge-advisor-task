stimuli:
  instruction:
    type: text
    font: SimHei
    text: '年份估计与建议


      第一部分：独立回答十二道历史年份题，请不要查资料。

      输入你认为的公历年份（整数），不填单位或逗号；按回车提交。

      每次最多四十五秒。空白或格式错误会记为无效，不会要求重填。

      时间到仍未提交的文字只保存为草稿，不会当作估计。


      第二部分：再次回答同样的问题，同时看到你的原估计和一条建议。

      建议由电脑按预设规则生成，不是其他人的真实回答，也不保证准确。

      你可以采纳、部分采纳或不采纳；最终回答需要重新输入并按回车提交。

      不会显示正确答案、对错或个人评分，没有准确性奖金。


      按空格键开始。'
    color: black
    height: 25
    wrapWidth: 1100
    pos:
    - 0
    - 0
  transition:
    type: text
    font: SimHei
    text: '独立估计部分结束


      下面会按相同顺序再次呈现这些问题。

      先查看你的原估计和电脑生成的建议，再输入最终年份。

      建议不是其他人的真实回答，不保证准确。

      若之前没有有效提交，本题不会显示建议或要求最终回答。


      按空格键继续。'
    color: black
    height: 26
    wrapWidth: 1100
    pos:
    - 0
    - 0
